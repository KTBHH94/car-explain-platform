<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | CarExplain</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container { max-width: 420px; margin: 80px auto 120px; padding: 40px; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .auth-container h2 { margin-top: 0; color: var(--navy); font-size: 28px; letter-spacing: -1px; }
    .auth-container p.sub { color: var(--muted); font-size: 14px; margin-bottom: 25px; }
    .auth-container .input-group { position: relative; margin-bottom: 16px; width: 100%; }
    .auth-container input { width: 100%; padding: 14px 40px 14px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
    .auth-container input:focus { border-color: var(--blue2); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .auth-container .btn { width: 100%; padding: 14px; margin-top: 10px; font-size: 15px; }
    #auth-error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; text-align: center; }
    #auth-success { color: #047857; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; text-align: center; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="site-container header-flex">
    <div class="logo-group"><a href="index.html" class="brand-logo">CAR<span>EXPLAIN</span></a></div>
    <div class="header-actions" id="headerAuth"></div>
  </div>
</header>

<main>
  <div class="auth-container">
    <h2>Set New Password</h2>
    <p class="sub">Please enter your new password below.</p>
    <div id="auth-error"></div>
    <div id="auth-success"></div>
    
    <form id="reset-form">
      <div class="input-group">
        <input type="password" id="new-password" placeholder="New Password (min 6 characters)" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Update Password</button>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="site-container footer-bottom">
    <p>&copy; 2026 CarExplain. Reference guidance only — it does not replace professional garage verification.</p>
  </div>
</footer>

<script>
  const API_URL = "https://carxplain-api.murningella.workers.dev";
  const form = document.getElementById('reset-form');
  const errorDiv = document.getElementById('auth-error');
  const successDiv = document.getElementById('auth-success');
  const submitBtn = document.getElementById('submit-btn');

  // Supabase sends the token in the URL hash (e.g. #access_token=xxx&type=recovery)
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = hashParams.get('access_token');

  if (!accessToken) {
    errorDiv.innerText = "Invalid or missing reset token. Please request a new email.";
    errorDiv.style.display = 'block';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    submitBtn.innerText = 'Updating...';
    submitBtn.disabled = true;

    const newPassword = document.getElementById('new-password').value;

    try {
      const response = await fetch(`${API_URL}/api/auth/update-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword, token: accessToken })
      });
      
      const data = await response.json();

      if (!response.ok) throw new Error(data.error || 'Failed to update password');

      successDiv.innerText = "Password updated successfully! Redirecting to login...";
      successDiv.style.display = 'block';
      
      setTimeout(() => {
        window.location.href = 'login.html?mode=login';
      }, 2000);

    } catch (error) {
      errorDiv.innerText = error.message;
      errorDiv.style.display = 'block';
      submitBtn.innerText = 'Update Password';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
