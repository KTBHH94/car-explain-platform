<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussion | CarExplain</title>
<link rel="stylesheet" href="styles.css">
<style>
  .thread-container { max-width: 850px; margin: 40px auto; }
  .back-link { font-size: 14px; font-weight: 800; color: var(--blue); text-decoration: none; display: inline-block; margin-bottom: 20px; transition: 0.2s; }
  .back-link:hover { color: var(--navy); transform: translateX(-3px); }
  
  /* Main Post Card */
  .main-post { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 32px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(15,23,42,.03); }
  .post-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; flex-shrink: 0; }
  .post-meta { font-size: 14px; color: var(--slate); }
  .post-meta strong { color: var(--navy); font-weight: 900; font-size: 16px; display: block; margin-bottom: 2px; }
  .main-post h1 { font-size: 28px; color: var(--navy); margin: 0 0 16px; letter-spacing: -0.5px; line-height: 1.3; }
  .main-post .content { font-size: 16px; color: #334155; line-height: 1.7; white-space: pre-wrap; }
  
  /* Category Badges */
  .badge { font-size: 11px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.5px; display: inline-block; margin-top: 20px; }
  .badge-general { background: #f1f5f9; color: #334155; }
  .badge-diagnosis { background: #e0e7ff; color: #3730a3; }
  .badge-repair { background: #dcfce7; color: #166534; }
  .badge-cost { background: #fef08a; color: #854d0e; }
  .badge-mot { background: #ffedd5; color: #9a3412; }

  /* Replies */
  .replies-header { font-size: 18px; color: var(--navy); font-weight: 900; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
  .reply-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
  .reply-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px 24px; display: flex; gap: 16px; }
  .reply-card .avatar { width: 40px; height: 40px; font-size: 16px; background: #64748b; }
  .reply-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .reply-meta strong { color: var(--slate); font-weight: 800; }
  .reply-content { font-size: 15px; color: #334155; line-height: 1.6; white-space: pre-wrap; }
  
  /* Reply Form */
  .reply-form-box { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(15,23,42,.03); }
  .reply-form-box h4 { margin-top: 0; color: var(--navy); margin-bottom: 16px; font-size: 18px; }
  .reply-form-box textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; font-family: inherit; font-size: 14px; resize: vertical; min-height: 100px; margin-bottom: 16px; box-sizing: border-box; }
  .reply-form-box textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-container header-flex">
    <div class="logo-group"><a href="index.html" class="brand-logo">CAR<span>EXPLAIN</span></a></div>
    <nav class="main-navigation">
      <a href="diagnose.html" class="nav-link">Diagnostics</a>
      <a href="quote-checker.html" class="nav-link">Quote Checker</a>
      <a href="garage.html" class="nav-link">My Garage</a>
      <a href="community.html" class="nav-link">Community</a>
      <a href="car-research.html" class="nav-link">Car Research</a>
    </nav>
    <div class="header-actions" id="headerAuth"></div>
  </div>
</header>

<main class="site-container">
  <div class="thread-container">
    <a href="community.html" class="back-link">← Back to Community</a>
    
    <div id="postContainer">
      <p style="color: var(--muted); text-align: center; padding: 40px;">Loading post...</p>
    </div>

    <div id="repliesContainer">
      <!-- Replies will load here -->
    </div>

    <div class="reply-form-box" id="replyFormBox" style="display:none;">
      <h4>Add a Reply</h4>
      <form id="replyForm">
        <textarea id="replyContent" required placeholder="Share your experience or ask a follow-up question..."></textarea>
        <div style="text-align:right;">
          <button type="submit" class="btn btn-primary" id="submitReplyBtn">Post Reply</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-container footer-bottom">
    <p>&copy; 2026 CarExplain. Reference guidance only — it does not replace professional garage verification.</p>
  </div>
</footer>

<script>
const API_URL = "https://carxplain-api.murningella.workers.dev";
const token = localStorage.getItem('sb-access-token');
const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get('id');

// --- HELPER: Turn profile into a nice display name ---
function getDisplayName(profile) {
  if (profile?.username) return profile.username;
  if (profile?.email) {
    const prefix = profile.email.split('@')[0];
    if (prefix.includes('.')) {
      return prefix.split('.').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }
    return prefix.charAt(0).toUpperCase() + prefix.slice(1);
  }
  return "Anonymous Driver";
}

function getCategoryClass(cat) {
  if (cat === 'Diagnosis') return 'badge-diagnosis';
  if (cat === 'Repair Outcome') return 'badge-repair';
  if (cat === 'Cost Question') return 'badge-cost';
  if (cat === 'MOT') return 'badge-mot';
  return 'badge-general';
}

// Header Auth Logic
document.addEventListener("DOMContentLoaded", () => {
  const headerAuth = document.getElementById('headerAuth');
  if (headerAuth) {
    if (token) {
      headerAuth.innerHTML = `<a href="#" class="login-action" id="logoutBtn">Log Out</a><a href="garage.html" class="btn btn-primary">My Garage</a>`;
      document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); localStorage.clear(); window.location.href = 'login.html'; });
    } else {
      headerAuth.innerHTML = `<a href="login.html" class="login-action">Log In</a><a href="signup.html" class="btn btn-primary">Sign Up</a>`;
    }
  }

  if (!postId) {
    document.getElementById('postContainer').innerHTML = `<p style="color:red;">Post not found.</p>`;
    return;
  }

  loadPost();
  loadReplies();

  if (token) {
    document.getElementById('replyFormBox').style.display = 'block';
  }
});

async function loadPost() {
  try {
    const res = await fetch(`${API_URL}/api/community/posts/${postId}`);
    const data = await res.json();
    
    if (data.error) throw new Error(data.error);

    const post = data.post;
    const date = new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    const displayName = getDisplayName(post.profiles);
    const initial = displayName.charAt(0).toUpperCase();
    const badgeClass = getCategoryClass(post.category);

    document.getElementById('postContainer').innerHTML = `
      <div class="main-post">
        <div class="post-header">
          <div class="avatar">${initial}</div>
          <div class="post-meta">
            <strong>${displayName}</strong>
            Posted on ${date}
          </div>
        </div>
        <h1>${post.title}</h1>
        <div class="content">${post.content}</div>
        <span class="badge ${badgeClass}">${post.category}</span>
      </div>
    `;
  } catch (e) {
    document.getElementById('postContainer').innerHTML = `<p style="color:red;">Error loading post: ${e.message}</p>`;
  }
}

async function loadReplies() {
  const container = document.getElementById('repliesContainer');
  try {
    const res = await fetch(`${API_URL}/api/community/replies/${postId}`);
    const data = await res.json();
    
    if (!data.replies || data.replies.length === 0) {
      container.innerHTML = `<div class="replies-header">0 Replies</div><p style="color:var(--muted); font-size:15px; margin-bottom:30px;">No replies yet. Be the first to help!</p>`;
      return;
    }

    const html = data.replies.map(reply => {
      const date = new Date(reply.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const displayName = getDisplayName(reply.profiles);
      const initial = displayName.charAt(0).toUpperCase();
      
      return `
        <div class="reply-card">
          <div class="avatar">${initial}</div>
          <div style="flex:1;">
            <div class="reply-meta">
              <strong>${displayName}</strong>
              <span>${date}</span>
            </div>
            <div class="reply-content">${reply.content}</div>
          </div>
        </div>
      `;
    }).join("");

    container.innerHTML = `
      <div class="replies-header">${data.replies.length} ${data.replies.length === 1 ? 'Reply' : 'Replies'}</div>
      <div class="reply-list">${html}</div>
    `;
  } catch (e) {
    container.innerHTML = `<p style="color:red;">Error loading replies.</p>`;
  }
}

// Handle Reply Submit
document.getElementById('replyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const content = document.getElementById('replyContent').value;
  const btn = document.getElementById('submitReplyBtn');
  
  btn.textContent = "Posting...";
  btn.disabled = true;

  try {
    const res = await fetch(`${API_URL}/api/community/replies`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ post_id: postId, content: content })
    });
    
    if (res.ok) {
      document.getElementById('replyForm').reset();
      loadReplies(); // Reload replies
    } else {
      const err = await res.json();
      alert("Error: " + err.error);
    }
  } catch (err) {
    alert("Failed to connect to server.");
  } finally {
    btn.textContent = "Post Reply";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
