<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Control | CarExplain</title>
<link rel="stylesheet" href="styles.css">
<style>
  .admin-container { max-width: 1100px; margin: 40px auto; }
  .admin-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
  .admin-header h1 { color: var(--navy); margin: 0; font-size: 32px; letter-spacing: -1px; }
  .badge-admin { background: #ef4444; color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; text-transform: uppercase; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .stat-box { background: #fff; border: 1px solid #cbd5e1; padding: 24px; border-radius: 12px; text-align: center; }
  .stat-box h3 { margin: 0 0 10px; color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .stat-box p { margin: 0; font-size: 36px; font-weight: 900; color: var(--navy); }

  .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #cbd5e1; padding-bottom: 10px; }
  .tab-btn { background: none; border: none; font-size: 16px; font-weight: 800; color: var(--muted); cursor: pointer; padding: 10px 20px; border-radius: 8px; }
  .tab-btn.active { background: #e8eefc; color: var(--blue); }

  .admin-panel { display: none; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 30px; }
  .admin-panel.active { display: block; }

  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { padding: 15px; background: #f8fafc; border-bottom: 2px solid #cbd5e1; color: var(--navy); font-weight: 800; }
  td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: #334155; font-size: 14px; }
  
  .plan-select { padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 700; }
  .btn-delete { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 800; transition: 0.2s; }
  .btn-delete:hover { background: #b91c1c; color: #fff; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-container header-flex">
    <div class="logo-group"><a href="index.html" class="brand-logo">CAR<span>EXPLAIN</span></a></div>
    <nav class="main-navigation">
      <a href="diagnose.html" class="nav-link">Diagnostics</a>
      <a href="quote-checker.html" class="nav-link">Quote Checker</a>
      <a href="garage.html" class="nav-link">My Garage</a>
      <a href="community.html" class="nav-link">Community</a>
      <a href="admin.html" class="nav-link" style="color:#ef4444;">Admin</a>
    </nav>
    <div class="header-actions" id="headerAuth"></div>
  </div>
</header>

<main class="site-container">
  <div class="admin-container" id="adminContent" style="display:none;">
    
    <div class="admin-header">
      <h1>Admin Control Panel</h1>
      <span class="badge-admin">Super Admin</span>
    </div>

    <div class="stats-grid">
      <div class="stat-box"><h3>Total Users</h3><p id="statUsers">0</p></div>
      <div class="stat-box"><h3>Community Posts</h3><p id="statPosts">0</p></div>
      <div class="stat-box"><h3>System Status</h3><p style="color:#16a34a; font-size:24px;">Online</p></div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="users">User Management</button>
      <button class="tab-btn" data-tab="posts">Moderation</button>
    </div>

    <!-- USERS TAB -->
    <div class="admin-panel active" id="users-panel">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Joined</th>
            <th>Plan</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="4">Loading users...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- POSTS TAB -->
    <div class="admin-panel" id="posts-panel">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Author</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="postsTableBody">
          <tr><td colspan="5">Loading posts...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<script>
const API_URL = "https://carxplain-api.murningella.workers.dev";
const token = localStorage.getItem('sb-access-token');

document.addEventListener("DOMContentLoaded", async () => {
  if (!token) { window.location.href = 'login.html'; return; }

  // 1. Verify Admin Status
  try {
    const res = await fetch(`${API_URL}/api/user/profile`, { headers: { "Authorization": `Bearer ${token}` } });
    const data = await res.json();
    
    if (!data.is_admin) {
      alert("Access Denied. You are not an admin.");
      window.location.href = 'garage.html';
      return;
    }
    
    // Show admin panel
    document.getElementById('adminContent').style.display = 'block';
    loadStats();
    loadUsers();
    loadPosts();
    
  } catch (e) {
    window.location.href = 'garage.html';
  }
});

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`${btn.dataset.tab}-panel`).classList.add('active');
  });
});

// Loaders
async function loadStats() {
  const res = await fetch(`${API_URL}/api/admin/stats`, { headers: { "Authorization": `Bearer ${token}` } });
  const data = await res.json();
  document.getElementById('statUsers').innerText = data.users || 0;
  document.getElementById('statPosts').innerText = data.posts || 0;
}

async function loadUsers() {
  const tbody = document.getElementById('usersTableBody');
  const res = await fetch(`${API_URL}/api/admin/users`, { headers: { "Authorization": `Bearer ${token}` } });
  const data = await res.json();
  
  tbody.innerHTML = data.users.map(u => `
    <tr>
      <td><strong>${u.username || 'N/A'}</strong></td>
      <td>${u.email}</td>
      <td>${new Date(u.created_at || Date.now()).toLocaleDateString('en-GB')}</td>
      <td>
        <select class="plan-select" onchange="updatePlan('${u.id}', this.value)">
          <option value="free" ${u.plan === 'free' ? 'selected' : ''}>Free</option>
          <option value="premium" ${u.plan === 'premium' ? 'selected' : ''}>Premium</option>
        </select>
      </td>
    </tr>
  `).join("");
}

async function loadPosts() {
  const tbody = document.getElementById('postsTableBody');
  const res = await fetch(`${API_URL}/api/admin/posts`, { headers: { "Authorization": `Bearer ${token}` } });
  const data = await res.json();
  
  tbody.innerHTML = data.posts.map(p => `
    <tr>
      <td><strong>${p.title}</strong></td>
      <td>${p.category}</td>
      <td>${p.profiles?.username || p.profiles?.email?.split('@')[0] || 'Unknown'}</td>
      <td>${new Date(p.created_at).toLocaleDateString('en-GB')}</td>
      <td><button class="btn-delete" onclick="deletePost('${p.id}', this)">Delete</button></td>
    </tr>
  `).join("");
}

// Actions
async function updatePlan(userId, newPlan) {
  if (!confirm(`Change this user's plan to ${newPlan}?`)) return;
  await fetch(`${API_URL}/api/admin/users/plan`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
    body: JSON.stringify({ targetUserId: userId, newPlan })
  });
  alert("Plan updated!");
}

async function deletePost(postId, btn) {
  if (!confirm("Delete this post forever? This will also delete all replies.")) return;
  btn.innerText = "Deleting...";
  await fetch(`${API_URL}/api/admin/posts/${postId}`, {
    method: "DELETE",
    headers: { "Authorization": `Bearer ${token}` }
  });
  btn.closest('tr').remove();
  loadStats(); // Update count
}
</script>
</body>
</html>
